name: zmix
description: "ZMIX - YouTube playlist cinema library"
publish_to: "none"
version: 0.2.2+4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  youtube_explode_dart: ^3.1.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  intl: any
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  screen_brightness: ^2.1.11
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Naskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
